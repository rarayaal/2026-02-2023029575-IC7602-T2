replicaCount: 1

image:
  repository: subnet-calculator
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 9666
  targetPort: 9666
  nodePort: 30666

resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 20m
    memory: 16Mi

nodeSelector: {}
tolerations: []
affinity: {}
